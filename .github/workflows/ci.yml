name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        run: pip install -r requirements.txt pytest ruff
      - name: 静态检查（先只查语法错误和未定义的名字）
        run: ruff check app --select E9,F63,F7,F82
      - name: 测试
        run: pytest -q -m "not slow"

  # 阶段 1 创建前端后，教练在这里加 frontend 任务：npm ci、npm run build
